name: Deploy Laravel to cPanel via FTP

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: 🚚 Get latest code
        uses: actions/checkout@v4
        with:
          fetch-depth: 2
      
      - name: 🐘 Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          
      - name: 📦 Install PHP Dependencies
        run: composer install --no-dev --no-interaction --prefer-dist --optimize-autoloader
        
      - name: 🟢 Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          
      - name: 🛠️ Install NPM Dependencies & Build Assets
        run: |
          npm install
          npm run build
          
      - name: 📂 Sync files to cPanel
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          # Sesuaikan folder tujuan di cPanel, tambahkan garis miring di akhir!
          # Folder untuk domain pelindo.luqmandev.my.id
          server-dir: /public_html/pelindo.luqmandev.my.id/
